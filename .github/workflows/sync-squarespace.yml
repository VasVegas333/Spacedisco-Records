name: Sync Squarespace content
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-squarespace.mjs'
      - '.github/workflows/sync-squarespace.yml'

permissions:
  contents: write

concurrency:
  group: squarespace-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull and validate Squarespace content
        env:
          SQUARESPACE_SOURCE_BASE: ${{ vars.SQUARESPACE_SOURCE_BASE }}
        run: node scripts/sync-squarespace.mjs
      - name: Commit validated content changes
        run: |
          git config user.name "spacedisco-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/squarespace.json src/data/artists.json src/data/releases.json
          if git diff --cached --quiet; then
            echo "No validated Squarespace content changes"
            exit 0
          fi
          git commit -m "Auto-sync Squarespace content"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Unable to publish sync after 3 attempts"
          exit 1
